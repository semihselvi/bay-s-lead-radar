name: GOLDEN VISA - Buyer Intent Radar

"on":
  push:
    branches: [main]
    paths:
      - europe_abroad_buyer_radar.py
      - europe_abroad_buyer_radar_verified.py
      - europe_buyer_serper_resilient.py
      - test_europe_abroad_buyer_radar.py
      - test_europe_abroad_buyer_radar_verified.py
      - test_europe_buyer_serper_resilient.py
      - .github/workflows/golden-visa-buyer.yml
  workflow_dispatch:
  schedule:
    - cron: "55 6,12,18 * * *"

jobs:
  golden-visa-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test source-verified abroad buyer radar
        run: |
          python -m py_compile europe_abroad_buyer_radar.py europe_abroad_buyer_radar_verified.py europe_buyer_serper_resilient.py test_europe_abroad_buyer_radar.py test_europe_abroad_buyer_radar_verified.py test_europe_buyer_serper_resilient.py
          python -m unittest -q test_europe_abroad_buyer_radar.py test_europe_abroad_buyer_radar_verified.py test_europe_buyer_serper_resilient.py
      - name: Run Golden Visa buyer intent radar
        if: github.event_name != 'push'
        env:
          ABROAD_RADAR_PROFILE: golden_visa
          ABROAD_RADAR_LOOKBACK_DAYS: "7"
          ABROAD_RADAR_QUERY_LIMIT: "10"
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python europe_buyer_serper_resilient.py
