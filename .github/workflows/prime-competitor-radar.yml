name: Prime Kibris Competitor Radar (pilot)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'competitor_radar/**'
      - '.github/workflows/prime-competitor-radar.yml'
  schedule:
    - cron: '35 6 * * *'

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - run: python -m unittest competitor_radar.test_radar -v
      - name: Restore previous state
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: competitor_radar_state.json
          key: prime-competitor-${{ github.run_id }}
          restore-keys: |
            prime-competitor-
      - name: Collect public competitor pages
        if: github.event_name != 'pull_request'
        run: python -m competitor_radar.radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Offline smoke test on pull requests
        if: github.event_name == 'pull_request'
        run: python -m competitor_radar.radar --dry-run
      - name: Live public-site pilot (no notifications)
        if: github.event_name == 'pull_request'
        run: |
          python -m competitor_radar.radar
          cat competitor-radar-report/report.md
      - name: Save state
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: competitor_radar_state.json
          key: prime-competitor-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        with:
          name: prime-competitor-report
          path: competitor-radar-report/
          retention-days: 30
