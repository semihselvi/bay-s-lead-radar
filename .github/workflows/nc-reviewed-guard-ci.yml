name: CI - NC Reviewed Guard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nc-reviewed-guard-ci.yml"

permissions:
  contents: read

concurrency:
  group: nc-reviewed-guard-ci
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/radar-v5-buyer-expansion
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile reviewed guard
        run: |
          python -m py_compile main_v5_5.py nc_v5_diagnostic_runner.py nc_v5_diagnostic_runner_quality.py reddit_nc_buyer_miner_resilient.py reddit_nc_buyer_miner_resilient_quality.py test_v5_5_gate.py test_reddit_nc_buyer_miner_resilient.py test_nc_reviewed_false_positives.py
      - name: Run regressions
        run: |
          python -m unittest -q test_v5_5_gate.py test_reddit_nc_buyer_miner_resilient.py test_nc_reviewed_false_positives.py
