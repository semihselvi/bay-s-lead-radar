name: TEMP V5 Quality CI

on:
  push:
    branches: [feature/radar-v5-buyer-expansion]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile V5 quality stack
        run: |
          python -m py_compile main.py main_v5.py main_v5_1.py main_v5_2.py main_v5_3.py main_v5_4.py main_v5_5.py nc_v5_batch_quality_guard.py nc_v5_diagnostic_runner.py nc_v5_diagnostic_runner_quality.py reddit_nc_buyer_miner.py reddit_nc_buyer_miner_resilient.py reddit_nc_buyer_miner_resilient_quality.py test_v5_1_gate.py test_v5_3_gate.py test_v5_5_gate.py test_reddit_nc_buyer_miner.py test_reddit_nc_buyer_miner_resilient.py test_nc_reviewed_false_positives.py
      - name: Run V5 regressions
        run: |
          python -m unittest -q test_v5_1_gate.py test_v5_3_gate.py test_v5_5_gate.py test_reddit_nc_buyer_miner.py test_reddit_nc_buyer_miner_resilient.py test_nc_reviewed_false_positives.py
