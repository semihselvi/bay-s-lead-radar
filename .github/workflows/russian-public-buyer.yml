name: NC - Russian Public Buyer Radar

"on":
  workflow_dispatch:
  schedule:
    - cron: "40 1 * * *"
    - cron: "40 7 * * *"
    - cron: "40 13 * * *"
    - cron: "40 19 * * *"

concurrency:
  group: nc-russian-public-buyer-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout production branch
        uses: actions/checkout@v6
        with:
          ref: feature/radar-v5-buyer-expansion

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Russian public buyer adapter
        run: |
          python -m py_compile russian_public_buyer_radar.py test_russian_public_buyer_radar.py
          python -m unittest -q test_russian_public_buyer_radar.py

      - name: Run Russian public buyer radar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RADAR_SALES_ONLY: "1"
          RADAR_V5_WEB_MAX_AGE_DAYS: "90"
        run: python russian_public_buyer_radar.py
