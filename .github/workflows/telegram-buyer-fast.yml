name: PRIME KIBRIS - Buyer Radar

"on":
  workflow_dispatch:
  schedule:
    - cron: "10 */2 * * *"

concurrency:
  group: nc-lead-radar-production
  cancel-in-progress: false

jobs:
  telegram-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout NC production branch
        uses: actions/checkout@v6
        with:
          ref: production/radar

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore dedicated Prime Telegram session
        env:
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_PRIME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from telethon.sessions import StringSession, SQLiteSession

          value=os.environ.get("TELEGRAM_STRING_SESSION","").strip()
          if not value:
              raise SystemExit("ERROR: TELEGRAM_STRING_SESSION_PRIME missing")

          src=StringSession(value)
          base=Path("telegram_radar_session/radar_session")
          base.parent.mkdir(parents=True, exist_ok=True)
          dst=SQLiteSession(str(base))
          dst.set_dc(src.dc_id, src.server_address, src.port)
          dst.auth_key=src.auth_key
          dst.save()
          dst.close()
          print("Dedicated Prime Telegram session restored")
          PY

      - name: Verify Prime buyer radar
        run: |
          python -m py_compile northlab_lead_radar_core.py nc_v6_broad_radar.py
          python -m unittest -q test_northlab_lead_radar_core.py
          python -m unittest -q test_nc_v6_broad_radar.py

      - name: Run Prime Buyer Radar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          RADAR_SALES_ONLY: "1"
          RADAR_V5_TELEGRAM_HOURS: "6"
          RADAR_GLOBAL_TELEGRAM_DAYS: "7"
          RADAR_PUBLIC_PEER_SCAN_LIMIT: "90"
          RADAR_LEARNED_TELEGRAM_QUERIES: "20"
          RADAR_SOURCE_EXPANSION_SEEDS: "8"
          RADAR_SOURCE_EXPANSION_CANDIDATES: "24"
          RADAR_CRAWL4AI_RUN_BUDGET: "8"
          RADAR_CRAWL4AI_PER_CALL: "2"
        run: python northlab_lead_radar_core.py

      - name: Cleanup Telegram session
        if: always()
        run: rm -rf telegram_radar_session

  forum-buyers:
    name: Prime Buyer Radar - Kibkom and DonanımHaber
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Radar production
        uses: actions/checkout@v6
        with:
          ref: production/radar

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify forum buyer source
        run: |
          python -m py_compile public_web_buyer_radar.py forum_engine.py nc_v6_broad_radar.py
          python -m unittest -q test_public_web_buyer_radar.py test_forum_engine.py

      - name: Scan Kibkom and DonanımHaber for buyers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_SALES_ONLY: "1"
          RADAR_FORUM_ONLY: "1"
          RADAR_PUBLIC_WEB_MAX_FETCHES: "40"
          RADAR_PUBLIC_WEB_SOURCE_FETCH_QUOTA: "20"
          RADAR_PUBLIC_WEB_MAX_AGE_DAYS: "30"
          RADAR_PUBLIC_WEB_RESULTS_PER_QUERY: "8"
          RADAR_HTTP_TIMEOUT: "12"
        run: python public_web_buyer_radar.py
