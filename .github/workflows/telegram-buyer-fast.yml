name: PRIME KIBRIS - Buyer Radar

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-buyer-fast.yml"
  schedule:
    - cron: "10 */2 * * *"

concurrency:
  group: nc-lead-radar-production
  cancel-in-progress: false

jobs:
  telegram-fast:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 18

    steps:
      - name: Checkout NC production branch
        uses: actions/checkout@v6
        with:
          ref: production/radar

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore dedicated Prime Telegram session
        env:
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_PRIME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from telethon.sessions import StringSession, SQLiteSession

          value=os.environ.get("TELEGRAM_STRING_SESSION","").strip()
          if not value:
              raise SystemExit("ERROR: TELEGRAM_STRING_SESSION_PRIME missing")

          src=StringSession(value)
          base=Path("telegram_radar_session/radar_session")
          base.parent.mkdir(parents=True, exist_ok=True)
          dst=SQLiteSession(str(base))
          dst.set_dc(src.dc_id, src.server_address, src.port)
          dst.auth_key=src.auth_key
          dst.save()
          dst.close()
          print("Dedicated Prime Telegram session restored")
          PY

      - name: Verify Prime buyer radar
        run: |
          python -m py_compile northlab_lead_radar_core.py nc_v6_broad_radar.py
          python -m unittest -q test_northlab_lead_radar_core.py
          python -m unittest -q test_nc_v6_broad_radar.py

      - name: Scan Caesar Resort rental offers first
        timeout-minutes: 8
        continue-on-error: true
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          CAESAR_REPORT_PATH: caesar-rental-summary.json
        run: |
          python -m unittest -q test_caesar_rental_search.py
          python caesar_rental_search.py

      - name: Publish privacy-safe Caesar rental summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          CAESAR_REPORT_PATH: caesar-rental-summary.json
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          report = Path(os.environ["CAESAR_REPORT_PATH"])
          if not report.is_file():
              report.write_text(json.dumps({
                  "status": "failed_or_not_run",
                  "scanned_at": datetime.now(timezone.utc).isoformat(),
                  "error": "No Caesar rental scan report was produced",
              }, indent=2) + "\n", encoding="utf-8")

          repo = os.environ["GITHUB_REPOSITORY"]
          path = "reports/caesar-rental-latest.json"
          url = f"https://api.github.com/repos/{repo}/contents/{path}"
          headers = {
              "Authorization": "Bearer " + os.environ["GH_TOKEN"],
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "prime-caesar-rental-reporter",
          }
          sha = None
          try:
              req = urllib.request.Request(url + "?ref=main", headers=headers)
              with urllib.request.urlopen(req, timeout=15) as res:
                  sha = json.loads(res.read()).get("sha")
          except urllib.error.HTTPError as exc:
              if exc.code != 404:
                  raise
          payload = {
              "message": "Update Caesar Resort rental summary",
              "branch": "main",
              "content": base64.b64encode(report.read_bytes()).decode("ascii"),
          }
          if sha:
              payload["sha"] = sha
          req = urllib.request.Request(
              url, data=json.dumps(payload).encode("utf-8"),
              headers={**headers, "Content-Type": "application/json"},
              method="PUT",
          )
          with urllib.request.urlopen(req, timeout=20) as res:
              print("CAESAR_REPORT_PUBLISHED", res.status, path)
          PY

      - name: Run Prime Buyer Radar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          RADAR_SALES_ONLY: "1"
          RADAR_V5_TELEGRAM_HOURS: "6"
          RADAR_JOINED_TELEGRAM_HOURS: "48"
          # Re-run unit tests after repairing Russian rental expression syntax.
          # Joined groups and broadcast channels are both scanned; private DMs are excluded.
          RADAR_GLOBAL_TELEGRAM_DAYS: "7"
          RADAR_PUBLIC_PEER_SCAN_LIMIT: "90"
          RADAR_LEARNED_TELEGRAM_QUERIES: "20"
          RADAR_SOURCE_EXPANSION_SEEDS: "8"
          RADAR_SOURCE_EXPANSION_CANDIDATES: "24"
          RADAR_CRAWL4AI_RUN_BUDGET: "8"
          RADAR_CRAWL4AI_PER_CALL: "2"
        run: python northlab_lead_radar_core.py

      - name: Cleanup Telegram session
        if: always()
        run: rm -rf telegram_radar_session

  forum-buyers:
    name: Prime Buyer Radar - Kibkom and DonanımHaber
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Radar production
        uses: actions/checkout@v6
        with:
          ref: production/radar

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify forum buyer source
        run: |
          python -m py_compile public_web_buyer_radar.py forum_engine.py nc_v6_broad_radar.py
          python -m unittest -q test_public_web_buyer_radar.py test_forum_engine.py

      - name: Scan Kibkom and DonanımHaber for buyers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_SALES_ONLY: "1"
          RADAR_FORUM_ONLY: "1"
          RADAR_PUBLIC_WEB_MAX_FETCHES: "40"
          RADAR_PUBLIC_WEB_SOURCE_FETCH_QUOTA: "20"
          RADAR_PUBLIC_WEB_MAX_AGE_DAYS: "30"
          RADAR_PUBLIC_WEB_RESULTS_PER_QUERY: "8"
          RADAR_HTTP_TIMEOUT: "12"
        run: python public_web_buyer_radar.py

  vk-ok-buyers:
    name: Prime Buyer Radar - VK and OK
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Radar production
        uses: actions/checkout@v6
        with:
          ref: production/radar

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify VK and OK buyer logic
        run: |
          python -m py_compile russian_public_buyer_radar.py
          python -m unittest -q test_russian_public_buyer_radar.py

      - name: Scan VK and OK public buyers
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RADAR_VK_OK_ONLY: "1"
          RADAR_RU_PUBLIC_MAX_AGE_DAYS: "30"
          RADAR_HTTP_TIMEOUT: "12"
        run: python russian_public_buyer_radar.py
