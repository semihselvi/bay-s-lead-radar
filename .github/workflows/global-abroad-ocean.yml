name: OCEAN - Global Residents Buying Abroad

"on":
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "europe_abroad_buyer_radar.py"
      - "europe_buyer_serper_resilient.py"
      - "ocean_source_hub.py"
      - "ocean_learning.py"
      - "buyer_intent_core.py"
      - "global_semantic_buyer_radar.py"
      - "reddit_global_comment_rss.py"
      - "requirements-ocean.txt"
      - "test_ocean_learning.py"
      - ".github/workflows/global-abroad-ocean.yml"
  schedule:
    - cron: "40 5,11,17 * * *"

permissions:
  contents: write

concurrency:
  group: global-abroad-ocean-${{ github.ref }}
  cancel-in-progress: false

jobs:
  global-abroad-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        profile:
          - global_abroad
          - uk_abroad
          - ireland_abroad
          - poland_abroad
          - sweden_abroad
          - italy_abroad
          - spain_abroad
          - portugal_abroad
          - uae_abroad
          - uae_arabic_abroad
          - norway_abroad
          - denmark_abroad
          - finland_abroad
          - czechia_abroad
          - estonia_abroad

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install core dependencies
        run: pip install -r requirements.txt

      - name: Install optional Ocean adapters
        continue-on-error: true
        run: |
          pip install -r requirements-ocean.txt || true

      - name: Verify ocean buyer radar
        id: ocean_verify
        continue-on-error: true
        run: |
          set +e
          exec > >(tee ocean-verify.log) 2>&1

          echo "=== PY_COMPILE ==="
          python -m py_compile europe_abroad_buyer_radar.py europe_abroad_buyer_radar_verified.py europe_buyer_search_fallback.py europe_buyer_serper_resilient.py global_semantic_buyer_radar.py reddit_global_comment_rss.py buyer_intent_core.py ocean_source_hub.py ocean_learning.py test_buyer_intent_core.py test_ocean_learning.py
          rc1=$?
          echo "compile_rc=$rc1"

          echo "=== UNIT_TESTS ==="
          python -m unittest -q test_buyer_intent_core.py test_ocean_learning.py
          rc2=$?
          echo "tests_rc=$rc2"

          echo "=== PROFILE_CHECK ==="
          python - <<'PY'
          import europe_abroad_buyer_radar as r
          required = {
              "uk_abroad", "ireland_abroad", "poland_abroad", "sweden_abroad",
              "italy_abroad", "spain_abroad", "portugal_abroad", "uae_abroad",
              "uae_arabic_abroad", "norway_abroad", "denmark_abroad",
              "finland_abroad", "czechia_abroad", "estonia_abroad",
          }
          missing = sorted(required - set(r.PROFILES))
          if missing:
              raise SystemExit(f"Missing ocean profiles: {missing}")
          print("Ocean profiles OK:", ", ".join(sorted(required)))
          PY
          rc3=$?
          echo "profiles_rc=$rc3"
          echo "=== VERIFY SUMMARY ==="
          echo "compile=$rc1 tests=$rc2 profiles=$rc3"

          test "$rc1" -eq 0 -a "$rc2" -eq 0 -a "$rc3" -eq 0

      - name: Run unified Ocean Source Hub
        id: ocean_hub
        if: matrix.profile == 'global_abroad' && steps.ocean_verify.outcome == 'success'
        continue-on-error: true
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OCEAN_DISCOVERY_QUERY_LIMIT: "10"
          OCEAN_YOUTUBE_VIDEO_LIMIT: "12"
          OCEAN_YOUTUBE_COMMENTS_PER_VIDEO: "120"
          OCEAN_FORUM_URL_LIMIT: "10"
          OCEAN_FORUM_DL_TIMEOUT: "35"
        run: python ocean_source_hub.py

      - name: Persist Ocean run status
        if: always() && matrix.profile == 'global_abroad'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path("ocean-last-run.json")
          verify="${{ steps.ocean_verify.outcome }}"
          hub="${{ steps.ocean_hub.outcome }}"
          verify_log=""
          lp=Path("ocean-verify.log")
          if lp.exists():
              verify_log="\n".join(lp.read_text(encoding="utf-8", errors="replace").splitlines()[-80:])
          if verify != "success" or hub != "success":
              p.write_text(json.dumps({
                  "status":"failed",
                  "finished_at":datetime.now(timezone.utc).isoformat(),
                  "verify_outcome":verify,
                  "hub_outcome":hub,
                  "reason":"Ocean verification or Source Hub failed",
                  "verify_log":verify_log
              }, ensure_ascii=False, indent=2), encoding="utf-8")
          elif not p.exists():
              p.write_text(json.dumps({
                  "status":"failed",
                  "finished_at":datetime.now(timezone.utc).isoformat(),
                  "verify_outcome":verify,
                  "hub_outcome":hub,
                  "reason":"Ocean Source Hub reported success but wrote no status file"
              }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ocean-last-run.json
          git commit -m "Update Ocean last run status" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Fail job if Ocean verification or Source Hub failed
        if: matrix.profile == 'global_abroad' && (steps.ocean_verify.outcome == 'failure' || steps.ocean_hub.outcome == 'failure')
        run: exit 1

      - name: Run global abroad buyer discovery
        env:
          ABROAD_RADAR_PROFILE: ${{ matrix.profile }}
          ABROAD_RADAR_LOOKBACK_DAYS: "30"
          ABROAD_RADAR_QUERY_LIMIT: "10"
          RADAR_FALLBACK_QUERY_LIMIT: "4"
          RADAR_FALLBACK_MAX_RESULTS: "8"
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python europe_buyer_serper_resilient.py
