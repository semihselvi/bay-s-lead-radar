name: PRIME - Grand Sapphire 1+1 Scan

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/grand-sapphire-1p1-scan.yml"

concurrency:
  group: nc-lead-radar-production
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout radar production
        uses: actions/checkout@v6
        with:
          ref: production/radar

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Telethon
        run: pip install telethon

      - name: Restore Prime Telegram session
        env:
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_PRIME }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from telethon.sessions import StringSession, SQLiteSession
          value=os.environ.get("TELEGRAM_STRING_SESSION","").strip()
          if not value:
              raise SystemExit("ERROR: TELEGRAM_STRING_SESSION_PRIME missing")
          src=StringSession(value)
          base=Path("telegram_radar_session/radar_session")
          base.parent.mkdir(parents=True, exist_ok=True)
          dst=SQLiteSession(str(base))
          dst.set_dc(src.dc_id, src.server_address, src.port)
          dst.auth_key=src.auth_key
          dst.save()
          dst.close()
          PY

      - name: Scan Grand Sapphire 1+1 sale offers
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          GS_SALE_DAYS: "30"
        run: python grand_sapphire_1p1_sale_search.py

      - name: Cleanup
        if: always()
        run: rm -rf telegram_radar_session
