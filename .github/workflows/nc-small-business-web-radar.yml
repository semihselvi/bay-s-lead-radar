name: SALES - North Cyprus Small Business Web Radar

"on":
  workflow_dispatch:
  push:
    paths:
      - "small_business_web_radar.py"
      - "small_business_web_radar_reviewed.py"
      - "test_small_business_web_radar.py"
      - ".github/workflows/nc-small-business-web-radar.yml"
  schedule:
    - cron: "35 5 * * *"

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify small-business web radar
        run: |
          python -m py_compile small_business_web_radar.py small_business_web_radar_reviewed.py test_small_business_web_radar.py
          python -m unittest -q test_small_business_web_radar.py

      - name: Find and pre-review North Cyprus website redesign leads
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMALL_BIZ_QUERY_LIMIT: "16"
          SMALL_BIZ_SITE_LIMIT: "60"
          SMALL_BIZ_MIN_SCORE: "38"
          SMALL_BIZ_MAX_ALERTS: "12"
          SMALL_BIZ_REQUEST_TIMEOUT: "12"
          SMALL_BIZ_MAX_WORKERS: "6"
        run: python small_business_web_radar_reviewed.py