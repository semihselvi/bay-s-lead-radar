name: BAY-S Lead Radar V5 TEST

"on":
  workflow_dispatch:

jobs:
  radar-v5-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout V5 feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/radar-v5-buyer-expansion

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test V5 buyer gate
        run: |
          python -m py_compile main.py main_v5.py main_v5_1.py main_v5_2.py test_v5_1_gate.py
          python -m unittest -v test_v5_1_gate.py

      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION_01: ${{ secrets.TELEGRAM_SESSION_01 }}
          TELEGRAM_SESSION_02: ${{ secrets.TELEGRAM_SESSION_02 }}
          TELEGRAM_SESSION_03: ${{ secrets.TELEGRAM_SESSION_03 }}
          TELEGRAM_SESSION_04: ${{ secrets.TELEGRAM_SESSION_04 }}
          TELEGRAM_SESSION_05: ${{ secrets.TELEGRAM_SESSION_05 }}
          TELEGRAM_SESSION_06: ${{ secrets.TELEGRAM_SESSION_06 }}
          TELEGRAM_SESSION_07: ${{ secrets.TELEGRAM_SESSION_07 }}
          TELEGRAM_SESSION_08: ${{ secrets.TELEGRAM_SESSION_08 }}
        run: |
          python - <<'PY'
          import os
          import base64
          import gzip
          from pathlib import Path

          parts = []
          for i in range(1, 9):
              value = os.environ.get(f"TELEGRAM_SESSION_{i:02d}", "").strip()
              if value:
                  parts.append(value)

          if not parts:
              raise SystemExit("ERROR: TELEGRAM_SESSION parçaları bulunamadı.")

          try:
              session_data = gzip.decompress(base64.b64decode("".join(parts)))
          except Exception as exc:
              raise SystemExit(f"ERROR: Telegram session çözülemedi: {exc}")

          session_dir = Path("telegram_radar_session")
          session_dir.mkdir(parents=True, exist_ok=True)
          session_file = session_dir / "radar_session.session"
          session_file.write_bytes(session_data)
          print(f"Telegram session restored: {len(session_data)} bytes")
          PY

      - name: Run BAY-S Radar V5.2
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          RADAR_V5_TELEGRAM_HOURS: "48"
          RADAR_V5_TELEGRAM_BACKFILL_DAYS: "7"
          RADAR_V5_TELEGRAM_BACKFILL_LIMIT: "12"
          RADAR_V5_WEB_MAX_AGE_DAYS: "90"
        run: |
          python main_v5_2.py

      - name: Cleanup Telegram session
        if: always()
        run: rm -rf telegram_radar_session
