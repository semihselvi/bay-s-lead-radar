name: ABROAD - Switzerland Residents Buying Abroad

"on":
  workflow_dispatch:
  schedule:
    - cron: "45 6,12,18 * * *"

jobs:
  switzerland-abroad-buyer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test source-verified abroad buyer radar
        run: |
          python -m py_compile europe_abroad_buyer_radar.py europe_abroad_buyer_radar_verified.py europe_buyer_search_fallback.py europe_buyer_serper_resilient.py test_europe_abroad_buyer_radar.py test_europe_abroad_buyer_radar_verified.py test_europe_buyer_serper_resilient.py
          python -m unittest -q test_europe_abroad_buyer_radar.py test_europe_abroad_buyer_radar_verified.py test_europe_buyer_serper_resilient.py
      - name: Run Switzerland residents buying abroad radar
        env:
          ABROAD_RADAR_PROFILE: switzerland_abroad
          ABROAD_RADAR_LOOKBACK_DAYS: "7"
          ABROAD_RADAR_QUERY_LIMIT: "10"
          RADAR_FALLBACK_QUERY_LIMIT: "2"
          RADAR_FALLBACK_MAX_RESULTS: "5"
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python europe_buyer_serper_resilient.py
