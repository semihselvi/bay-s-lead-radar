name: NC - North Cyprus Buyer Radar
# production classifier: v6.4-review-quality-gate + direct-cmtt + native-ok-pikabu + free-reddit-rss-bing + native-vk + vk-html-diag + native-mailru

"on":
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/radar.yml"
  schedule:
    - cron: "25 0 * * *"
    - cron: "25 6 * * *"
    - cron: "25 12 * * *"
    - cron: "25 18 * * *"

concurrency:
  group: nc-lead-radar-production
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout NC production branch
        uses: actions/checkout@v6
        with:
          ref: feature/radar-v5-buyer-expansion

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify broad lead radar before scan
        run: |
          python -m py_compile main.py main_v5.py main_v5_1.py main_v5_2.py main_v5_3.py main_v5_4.py main_v5_5.py nc_v5_batch_quality_guard.py nc_v6_broad_radar.py reddit_nc_buyer_miner.py reddit_nc_buyer_miner_resilient.py reddit_nc_buyer_miner_resilient_quality.py russian_public_buyer_radar.py test_v5_1_gate.py test_v5_3_gate.py test_v5_5_gate.py test_reddit_nc_buyer_miner.py test_reddit_nc_buyer_miner_resilient.py test_nc_reviewed_false_positives.py test_nc_v6_broad_radar.py test_russian_public_buyer_radar.py
          python -m unittest -q test_v5_1_gate.py test_v5_3_gate.py test_v5_5_gate.py test_reddit_nc_buyer_miner.py test_reddit_nc_buyer_miner_resilient.py test_nc_reviewed_false_positives.py test_nc_v6_broad_radar.py test_russian_public_buyer_radar.py

      - name: Restore dedicated Prime Telegram session
        env:
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_PRIME }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from telethon.sessions import StringSession, SQLiteSession

          value=os.environ.get("TELEGRAM_STRING_SESSION","").strip()
          if not value:
              raise SystemExit("ERROR: TELEGRAM_STRING_SESSION_PRIME missing")

          src=StringSession(value)
          base=Path("telegram_radar_session/radar_session")
          base.parent.mkdir(parents=True, exist_ok=True)
          dst=SQLiteSession(str(base))
          dst.set_dc(src.dc_id, src.server_address, src.port)
          dst.auth_key=src.auth_key
          dst.save()
          dst.close()
          print("Dedicated Prime Telegram session restored")
          PY

      - name: Run Lead Radar V6 broad recall and debug funnel
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          RADAR_V5_TELEGRAM_HOURS: "24"
          RADAR_SALES_ONLY: "1"
          RADAR_V5_TELEGRAM_BACKFILL_DAYS: "7"
          RADAR_V5_TELEGRAM_BACKFILL_LIMIT: "12"
          RADAR_V5_WEB_MAX_AGE_DAYS: "90"
        run: python nc_v6_broad_radar.py

      - name: Mine Reddit buyer and research intent
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          NC_REDDIT_COMMENT_LOOKBACK_DAYS: "14"
          NC_REDDIT_QUERY_LIMIT: "10"
          NC_REDDIT_INDEX_LOOKBACK_DAYS: "30"
          NC_REDDIT_INDEX_QUERY_LIMIT: "12"
        run: python reddit_nc_buyer_miner_resilient_quality.py

      - name: Mine Russian public buyer sources
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          RADAR_SALES_ONLY: "1"
          RADAR_V5_WEB_MAX_AGE_DAYS: "90"
        run: python russian_public_buyer_radar.py

      - name: Cleanup Telegram session
        if: always()
        run: rm -rf telegram_radar_session
