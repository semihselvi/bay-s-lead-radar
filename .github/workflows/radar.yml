name: BAY-S Lead Radar Test

"on":
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt

      - name: Show source
        run: |
          echo "COMMIT:"
          git rev-parse HEAD
          echo "MAIN.PY:"
          head -30 main.py

      - name: Run test radar
        run: python main.py
