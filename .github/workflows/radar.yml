name: NC - North Cyprus Buyer Radar

"on":
  workflow_dispatch:
  schedule:
    - cron: "25 0 * * *"
    - cron: "25 6 * * *"
    - cron: "25 12 * * *"
    - cron: "25 18 * * *"

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout V5.5 production branch
        uses: actions/checkout@v6
        with:
          ref: feature/radar-v5-buyer-expansion

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify buyer gates before scan
        run: |
          python -m py_compile main.py main_v5.py main_v5_1.py main_v5_2.py main_v5_3.py main_v5_4.py main_v5_5.py reddit_nc_buyer_miner.py reddit_nc_buyer_miner_resilient.py test_v5_1_gate.py test_v5_3_gate.py test_v5_5_gate.py test_reddit_nc_buyer_miner.py test_reddit_nc_buyer_miner_resilient.py
          python -m unittest -q test_v5_1_gate.py test_v5_3_gate.py test_v5_5_gate.py test_reddit_nc_buyer_miner.py test_reddit_nc_buyer_miner_resilient.py

      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION_01: ${{ secrets.TELEGRAM_SESSION_01 }}
          TELEGRAM_SESSION_02: ${{ secrets.TELEGRAM_SESSION_02 }}
          TELEGRAM_SESSION_03: ${{ secrets.TELEGRAM_SESSION_03 }}
          TELEGRAM_SESSION_04: ${{ secrets.TELEGRAM_SESSION_04 }}
          TELEGRAM_SESSION_05: ${{ secrets.TELEGRAM_SESSION_05 }}
          TELEGRAM_SESSION_06: ${{ secrets.TELEGRAM_SESSION_06 }}
          TELEGRAM_SESSION_07: ${{ secrets.TELEGRAM_SESSION_07 }}
          TELEGRAM_SESSION_08: ${{ secrets.TELEGRAM_SESSION_08 }}
        run: |
          python - <<'PY'
          import os, base64, gzip
          from pathlib import Path
          parts=[os.environ.get(f"TELEGRAM_SESSION_{i:02d}","").strip() for i in range(1,9)]
          parts=[x for x in parts if x]
          if not parts:
              raise SystemExit("ERROR: TELEGRAM_SESSION parçaları bulunamadı.")
          try:
              data=gzip.decompress(base64.b64decode("".join(parts)))
          except Exception as exc:
              raise SystemExit(f"ERROR: Telegram session çözülemedi: {exc}")
          path=Path("telegram_radar_session/radar_session.session")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(data)
          print(f"Telegram session restored: {len(data)} bytes")
          PY

      - name: Run BAY-S Radar V5.5
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          RADAR_V5_TELEGRAM_HOURS: "24"
          RADAR_V5_TELEGRAM_BACKFILL_DAYS: "7"
          RADAR_V5_TELEGRAM_BACKFILL_LIMIT: "12"
          RADAR_V5_WEB_MAX_AGE_DAYS: "90"
        run: python main_v5_5.py

      - name: Mine Reddit buyer and research intent
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          NC_REDDIT_COMMENT_LOOKBACK_DAYS: "14"
          NC_REDDIT_QUERY_LIMIT: "10"
          NC_REDDIT_INDEX_LOOKBACK_DAYS: "30"
          NC_REDDIT_INDEX_QUERY_LIMIT: "12"
        run: python reddit_nc_buyer_miner_resilient.py

      - name: Cleanup Telegram session
        if: always()
        run: rm -rf telegram_radar_session
