      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION_01: ${{ secrets.TELEGRAM_SESSION_01 }}
          TELEGRAM_SESSION_02: ${{ secrets.TELEGRAM_SESSION_02 }}
          TELEGRAM_SESSION_03: ${{ secrets.TELEGRAM_SESSION_03 }}
          TELEGRAM_SESSION_04: ${{ secrets.TELEGRAM_SESSION_04 }}
          TELEGRAM_SESSION_05: ${{ secrets.TELEGRAM_SESSION_05 }}
          TELEGRAM_SESSION_06: ${{ secrets.TELEGRAM_SESSION_06 }}
          TELEGRAM_SESSION_07: ${{ secrets.TELEGRAM_SESSION_07 }}
          TELEGRAM_SESSION_08: ${{ secrets.TELEGRAM_SESSION_08 }}
        run: |
          python - <<'PY'
          import os
          import base64
          import gzip
          from pathlib import Path

          parts = []

          for i in range(1, 9):
              value = os.environ.get(
                  f"TELEGRAM_SESSION_{i:02d}",
                  ""
              ).strip()

              if value:
                  parts.append(value)

          if not parts:
              raise SystemExit(
                  "TELEGRAM_SESSION parçaları bulunamadı."
              )

          encoded = "".join(parts)
          compressed = base64.b64decode(encoded)
          session_data = gzip.decompress(compressed)

          session_dir = Path("telegram_radar_session")
          session_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          session_file = (
              session_dir /
              "radar_session.session"
          )

          session_file.write_bytes(session_data)

          print(
              "Telegram session restored:",
              session_file,
              "bytes=",
              len(session_data)
          )
          PY
