name: NORTHLAB - Sales Opportunity Radar

"on":
  workflow_dispatch:
  push:
    paths:
      - "northlab_sales_radar.py"
      - "test_northlab_sales_radar.py"
      - ".github/workflows/northlab-sales-radar.yml"
  schedule:
    - cron: "45 2 * * *"
    - cron: "45 8 * * *"
    - cron: "45 14 * * *"
    - cron: "45 20 * * *"

jobs:
  northlab-sales-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Northlab radar
        run: |
          python -m py_compile northlab_sales_radar.py test_northlab_sales_radar.py
          python -m unittest -q test_northlab_sales_radar.py

      - name: Restore Telegram session
        env:
          TELEGRAM_SESSION_01: ${{ secrets.TELEGRAM_SESSION_01 }}
          TELEGRAM_SESSION_02: ${{ secrets.TELEGRAM_SESSION_02 }}
          TELEGRAM_SESSION_03: ${{ secrets.TELEGRAM_SESSION_03 }}
          TELEGRAM_SESSION_04: ${{ secrets.TELEGRAM_SESSION_04 }}
          TELEGRAM_SESSION_05: ${{ secrets.TELEGRAM_SESSION_05 }}
          TELEGRAM_SESSION_06: ${{ secrets.TELEGRAM_SESSION_06 }}
          TELEGRAM_SESSION_07: ${{ secrets.TELEGRAM_SESSION_07 }}
          TELEGRAM_SESSION_08: ${{ secrets.TELEGRAM_SESSION_08 }}
        run: |
          python - <<'PY'
          import os, base64, gzip
          from pathlib import Path
          parts=[os.environ.get(f"TELEGRAM_SESSION_{i:02d}","").strip() for i in range(1,9)]
          parts=[x for x in parts if x]
          if not parts:
              raise SystemExit("ERROR: TELEGRAM_SESSION parçaları bulunamadı.")
          data=gzip.decompress(base64.b64decode("".join(parts)))
          path=Path("telegram_radar_session/radar_session.session")
          path.parent.mkdir(parents=True,exist_ok=True)
          path.write_bytes(data)
          print(f"Telegram session restored: {len(data)} bytes")
          PY

      - name: Run Northlab sales radar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          NORTHLAB_TELEGRAM_HOURS: "24"
          NORTHLAB_PER_GROUP_LIMIT: "100"
          NORTHLAB_MAX_ALERTS: "12"
          NORTHLAB_WEB_QUERY_LIMIT: "16"
        run: python northlab_sales_radar.py

      - name: Cleanup Telegram session
        if: always()
        run: rm -rf telegram_radar_session
