name: NORTHLAB - Sales Opportunity Radar

concurrency:
  group: northlab-sales-radar
  cancel-in-progress: true

"on":
  workflow_dispatch:
  push:
    paths:
      - "northlab_sales_radar.py"
      - "northlab_sales_source_hub.py"
      - "requirements-ocean.txt"
      - "test_northlab_sales_radar.py"
      - ".github/workflows/northlab-sales-radar.yml"
  schedule:
    - cron: "45 2 * * *"
    - cron: "45 8 * * *"
    - cron: "45 14 * * *"
    - cron: "45 20 * * *"

jobs:
  northlab-sales-radar:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-ocean.txt

      - name: Verify Northlab radar
        run: |
          python -m py_compile northlab_sales_radar.py northlab_sales_source_hub.py test_northlab_sales_radar.py
          python -m unittest -q test_northlab_sales_radar.py

      - name: Restore dedicated Northlab Telegram session
        env:
          TELEGRAM_STRING_SESSION: ${{ secrets.TELEGRAM_STRING_SESSION_NORTHLAB }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from telethon.sessions import StringSession, SQLiteSession

          value=os.environ.get("TELEGRAM_STRING_SESSION","").strip()
          if not value:
              raise SystemExit("ERROR: TELEGRAM_STRING_SESSION_NORTHLAB missing")

          src=StringSession(value)
          base=Path("telegram_radar_session/radar_session")
          base.parent.mkdir(parents=True, exist_ok=True)
          dst=SQLiteSession(str(base))
          dst.set_dc(src.dc_id, src.server_address, src.port)
          dst.auth_key=src.auth_key
          dst.save()
          dst.close()
          print("Dedicated Northlab Telegram session restored")
          PY

      - name: Run Northlab sales radar
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION_PATH: telegram_radar_session/radar_session.session
          NORTHLAB_TELEGRAM_HOURS: "24"
          NORTHLAB_PER_GROUP_LIMIT: "100"
          NORTHLAB_MAX_ALERTS: "12"
          NORTHLAB_WEB_QUERY_LIMIT: "24"
          NORTHLAB_GLOBAL_RESULTS_PER_QUERY: "30"
          NORTHLAB_SOURCE_HUB_LOOKBACK_DAYS: "14"
          NORTHLAB_YOUTUBE_VIDEO_LIMIT: "10"
          NORTHLAB_YOUTUBE_COMMENTS_PER_VIDEO: "100"
          NORTHLAB_FORUM_URL_LIMIT: "10"
          NORTHLAB_FORUM_DL_TIMEOUT: "35"
        run: python northlab_sales_radar.py

      - name: Persist Northlab last run status
        if: always()
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path("northlab-last-run.json")
          if not p.exists():
              p.write_text(json.dumps({
                  "status":"failed",
                  "finished_at":datetime.now(timezone.utc).isoformat(),
                  "reason":"Northlab radar wrote no status file"
              }, ensure_ascii=False, indent=2), encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add northlab-last-run.json
          git commit -m "Update Northlab last run status" || true
          git pull --rebase origin main || true
          git push origin HEAD:main || true

      - name: Cleanup Telegram session
        if: always()
        run: rm -rf telegram_radar_session
